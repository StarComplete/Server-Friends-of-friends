
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarComplete Minecraft Server</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#0d1117;color:#e6edf3;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:20px
}

.card{
    background:#161b22;border:1px solid #30363d;
    border-radius:16px;padding:32px;width:100%;
    max-width:480px;text-align:center;
    box-shadow:0 10px 30px #0008
}

.server-header{
    display:flex;align-items:center;
    justify-content:center;gap:16px;margin-bottom:8px
}

.server-icon{
    width:48px;height:48px;border-radius:8px;
    background:#21262d;object-fit:contain;display:none
}

h1{font-size:24px;font-weight:700}
.subtitle{color:#8b949e;font-size:14px;margin-bottom:20px}

.status{
    font-size:18px;font-weight:700;
    padding:10px 16px;border-radius:50px;
    display:inline-flex;align-items:center;gap:8px;
    margin-bottom:20px
}

.online{background:#3fb95022;color:#3fb950}
.offline{background:#f8514922;color:#f85149}
.checking{background:#d2992222;color:#d29922}
.starting{background:#58a6ff22;color:#58a6ff}
.stopping{background:#f0883e22;color:#f0883e}

.motd-box{
    background:#0d1117;border:1px solid #21262d;
    padding:12px;border-radius:8px;font-family:monospace;
    font-size:13px;margin-bottom:16px;color:#c9d1d9;
    display:none;white-space:pre-wrap;word-break:break-word
}

.info-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:10px;margin-bottom:16px
}

.info-card,.address-box{
    background:#0d1117;border:1px solid #21262d;
    padding:12px;border-radius:8px;text-align:left
}

.info-card label,.address-box label{
    display:block;font-size:11px;text-transform:uppercase;
    color:#8b949e;font-weight:600;margin-bottom:4px
}

.info-card div{font-size:15px;font-weight:600}

.address-box{margin-bottom:20px}

code{
    font-family:monospace;color:#58a6ff;
    font-size:14px;word-break:break-all
}

.actions{display:flex;gap:10px}

button{
    flex:1;background:#238636;color:white;border:0;
    padding:12px 16px;border-radius:8px;
    font-weight:600;cursor:pointer;
    transition:background .2s,transform .1s
}

button:hover{background:#2ea043}
button:active{transform:scale(.98)}

.player-list{
    margin-top:16px;display:flex;flex-wrap:wrap;
    gap:8px;justify-content:center
}

.player-tag{
    background:#21262d;border:1px solid #30363d;
    padding:4px 8px;border-radius:6px;font-size:12px;
    display:flex;align-items:center;gap:6px
}

.player-tag img{width:16px;height:16px;border-radius:2px}

small{
    display:block;margin-top:16px;
    color:#8b949e;font-size:12px
}

.toast{
    position:fixed;bottom:20px;left:50%;
    transform:translate(-50%,100px);
    background:#238636;color:white;padding:10px 20px;
    border-radius:8px;font-size:14px;font-weight:600;
    opacity:0;transition:all .3s ease
}

.toast.show{
    transform:translate(-50%,0);opacity:1
}
</style>
</head>

<body>

<div class="card">

    <div class="server-header">
        <img id="icon" class="server-icon" alt="Server Icon">
        <h1>StarComplete</h1>
    </div>

    <p class="subtitle">Minecraft Server Status</p>

    <div id="status" class="status checking">
        🟡 Connecting...
    </div>

    <div id="motd" class="motd-box"></div>

    <div class="info-grid">
        <div class="info-card">
            <label>Players</label>
            <div id="players">-- / --</div>
        </div>

        <div class="info-card">
            <label>Version</label>
            <div id="version">--</div>
        </div>
    </div>

    <div class="address-box">
        <label>Server Address</label>
        <code id="serverAddress"></code>
    </div>

    <div class="actions">
        <button onclick="copyIP()">📋 Copy IP</button>
    </div>

    <div id="playerList" class="player-list"></div>

    <small id="updated">Initializing automatic monitoring...</small>

</div>

<div id="toast" class="toast">Copied!</div>

<script>
"use strict";

const SERVER = "jensen-doubled.tun.ply.gg:25565";
const API = "https://api.mcstatus.io/v2/status/java/";
const CHECK_INTERVAL = 2000;
const TRANSITION_DURATION = 8000;
const REQUEST_TIMEOUT = 3000;


const $ = id => document.getElementById(id);

$("serverAddress").textContent = SERVER;

let previousState = null;
let transitionTimer = null;
let checking = false;
let lastSuccess = 0;

function setStatus(state, message) {
    const el = $("status");

    el.className = "status " + state;
    el.textContent = message;
}

function transition(state, message, finalState, finalMessage) {
    clearTimeout(transitionTimer);

    setStatus(state, message);

    transitionTimer = setTimeout(() => {
        setStatus(finalState, finalMessage);
    }, TRANSITION_DURATION);
}

function clearServerInfo() {
    $("players").textContent = "0 / --";
    $("version").textContent = "--";
    $("motd").style.display = "none";
    $("icon").style.display = "none";
    $("playerList").replaceChildren();
}

async function checkServer() {
    if (checking) return;
    checking = true;

    const controller = new AbortController();
    const timeout = setTimeout(
        () => controller.abort(),
        REQUEST_TIMEOUT
    );

    try {
        const response = await fetch(
            API + encodeURIComponent(SERVER),
            {
                cache: "no-store",
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        const isOnline = data.online;

        lastSuccess = Date.now();

        if (isOnline) {
            $("players").textContent =
                `${data.players?.online ?? 0} / ${data.players?.max ?? "?"}`;

            $("version").textContent =
                data.version?.name_clean ?? "Unknown";

            if (data.icon) {
                $("icon").src = data.icon;
                $("icon").style.display = "block";
            }

            if (data.motd?.clean) {
                $("motd").textContent = data.motd.clean.trim();
                $("motd").style.display = "block";
            }

            const list = $("playerList");
            list.replaceChildren();

            if (data.players?.list) {
                data.players.list.forEach(player => {
                    const tag = document.createElement("div");
                    tag.className = "player-tag";

                    const img = document.createElement("img");
                    img.src =
                        "https://mc-heads.net/avatar/" +
                        encodeURIComponent(
                            player.uuid || player.name_clean
                        ) + "/16";

                    img.alt = "";

                    const name = document.createElement("span");
                    name.textContent = player.name_clean;

                    tag.append(img, name);
                    list.appendChild(tag);
                });
            }

            if (previousState === false) {
                transition(
                    "starting",
                    "🔵 SERVER STARTING",
                    "online",
                    "🟢 SERVER ONLINE"
                );
            } else {
                setStatus("online", "🟢 SERVER ONLINE");
            }

        } else {
            clearServerInfo();

            if (previousState === true) {
                transition(
                    "stopping",
                    "🟠 SERVER STOPPING",
                    "offline",
                    "🔴 SERVER OFFLINE"
                );
            } else {
                setStatus("offline", "🔴 SERVER OFFLINE");
            }
        }

        previousState = isOnline;

        $("updated").textContent =
            "Last checked: " + new Date().toLocaleTimeString() +
            " • Auto-refresh every " +
            (CHECK_INTERVAL / 1000) + " seconds";

    } catch (error) {
        if (Date.now() - lastSuccess > 15000) {
            setStatus("checking", "🟡 CONNECTION LOST");

            $("updated").textContent =
                "Unable to reach status API • Retrying automatically";
        }

        console.warn("Status check failed:", error);

    } finally {
        clearTimeout(timeout);
        checking = false;
    }
}

async function copyIP() {
    try {
        await navigator.clipboard.writeText(SERVER);
        showToast("Server address copied!");
    } catch {
        showToast(SERVER);
    }
}

function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => toast.classList.remove("show"), 2500);
}

// Initial check
checkServer();

// Continuous automatic monitoring
setInterval(checkServer, CHECK_INTERVAL);
</script>

</body>
</html>
