
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarComplete Minecraft Server</title>

<style>
body {
    background: #0d1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 30px;
    max-width: 500px;
    margin: auto;
}

.status {
    font-size: 24px;
    font-weight: bold;
}

.online { color: #3fb950; }
.offline { color: #f85149; }
.checking { color: #d29922; }

button {
    background: #238636;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">
    <h1>🎮 Minecraft Server</h1>

    <p>Java Edition</p>

    <div id="status" class="status checking">
        Checking server...
    </div>

    <p id="players">Players: -- / --</p>
    <p id="version">Version: --</p>

    <p>
        <code>jensen-doubled.tun.ply.gg</code>
    </p>

    <button onclick="copyIP()">Copy Server IP</button>

    <p id="updated">Checking...</p>
</div>

<script>
const serverIP = "jensen-doubled.tun.ply.gg";

async function checkServer() {
    const status = document.getElementById("status");

    try {
        const response = await fetch(
            `https://api.mcsrvstat.us/3/${serverIP}`
        );

        if (!response.ok) throw new Error("API unavailable");

        const data = await response.json();

        if (data.online) {
            status.textContent = "🟢 ONLINE";
            status.className = "status online";

            document.getElementById("players").textContent =
                `Players: ${data.players?.online ?? 0} / ${data.players?.max ?? "?"}`;

            document.getElementById("version").textContent =
                `Version: ${data.version ?? "Unknown"}`;
        } else {
            status.textContent = "🔴 OFFLINE";
            status.className = "status offline";

            document.getElementById("players").textContent =
                "Players: 0 / --";

            document.getElementById("version").textContent =
                "Version: --";
        }

        document.getElementById("updated").textContent =
            "Last checked: " + new Date().toLocaleTimeString();

    } catch (error) {
        status.textContent = "⚠️ STATUS UNKNOWN";
        status.className = "status checking";

        document.getElementById("updated").textContent =
            "Couldn't contact status API";
    }
}

function copyIP() {
    navigator.clipboard.writeText(serverIP);
    alert("Server IP copied!");
}

checkServer();

// Automatically check every 60 seconds
setInterval(checkServer, 60000);
</script>

</body>
</html>
